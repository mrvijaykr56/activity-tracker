<div class="main-container d-flex justify-content-center align-items-center" style="min-height: 95vh; padding-top: 3rem; padding-bottom: 3rem;">
    <div class="glass-card p-5 animate-fade-in shadow-lg" style="width: 100%; max-width: 650px; background: rgba(255,255,255,0.05)">
        <div class="text-center mb-5">
            <h2 class="fw-bold mb-2 text-high-contrast">Create Account</h2>
            <p class="text-readable-secondary fw-medium">Join the ActivityTracker community today</p>
        </div>
        
        <form #registerForm="ngForm" (submit)="registerForm.form.valid && onRegister()">
            <div class="row mb-4">
                <div class="col-md-6">
                    <label for="firstname" class="form-label ms-1">First Name</label>
                    <input type="text" class="glass-input" id="firstname" [(ngModel)]="user.firstname" name="firstname" #firstname="ngModel" placeholder="John" required>
                    <div *ngIf="firstname.invalid && (firstname.dirty || firstname.touched)" class="mt-2 small text-danger ms-1 animate-fade-in">
                        <i class="bi bi-exclamation-circle me-1"></i> First name is required.
                    </div>
                </div>
                <div class="col-md-6 mt-4 mt-md-0">
                    <label for="lastname" class="form-label ms-1">Last Name</label>
                    <input type="text" class="glass-input" id="lastname" [(ngModel)]="user.lastname" name="lastname" #lastname="ngModel" placeholder="Doe" required>
                    <div *ngIf="lastname.invalid && (lastname.dirty || lastname.touched)" class="mt-2 small text-danger ms-1 animate-fade-in">
                        <i class="bi bi-exclamation-circle me-1"></i> Last name is required.
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-8">
                    <label for="username" class="form-label ms-1">Username</label>
                    <input type="text" class="glass-input" id="username" [(ngModel)]="user.username" name="username" #username="ngModel" placeholder="johndoe123" required minlength="3">
                    <div *ngIf="username.invalid && (username.dirty || username.touched)" class="mt-2 small text-danger ms-1 animate-fade-in">
                        <i class="bi bi-exclamation-circle me-1"></i>
                        <span *ngIf="username.errors?.['required']">Username is required.</span>
                        <span *ngIf="username.errors?.['minlength']">At least 3 characters.</span>
                    </div>
                </div>
                <div class="col-md-4 mt-4 mt-md-0">
                    <label for="age" class="form-label ms-1">Age</label>
                    <input type="number" class="glass-input" id="age" [(ngModel)]="user.age" name="age" #age="ngModel" placeholder="25" required min="1" max="120">
                    <div *ngIf="age.invalid && (age.dirty || age.touched)" class="mt-2 small text-danger ms-1 animate-fade-in">
                        <i class="bi bi-exclamation-circle me-1"></i> 1-120.
                    </div>
                </div>
            </div>

            <div class="mb-5">
                <label for="password" class="form-label ms-1">Password</label>
                <input type="password" class="glass-input" id="password" [(ngModel)]="user.password" name="password" #password="ngModel" placeholder="••••••••" required minlength="6">
                <div *ngIf="password.invalid && (password.dirty || password.touched)" class="mt-2 small text-danger ms-1 animate-fade-in">
                    <i class="bi bi-exclamation-circle me-1"></i> Password must be at least 6 characters.
                </div>
            </div>

            <button type="submit" class="glass-btn w-100 py-3 fs-5" [disabled]="registerForm.form.invalid || isRegistering" [class.btn-loading]="isRegistering">
                {{ isRegistering ? 'Creating Account...' : 'Get Started' }}
            </button>
        </form>

        <div class="mt-5 pt-4 border-top border-secondary border-opacity-10 text-center">
            <p class="text-readable-secondary mb-0 fw-medium">
                Already have an account? <a routerLink="/" class="text-decoration-none fw-bold gradient-text">Sign In</a>
            </p>
        </div>
    </div>
</div>
